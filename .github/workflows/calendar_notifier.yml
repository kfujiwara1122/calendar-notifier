name: Calendar Notifier

on:
  # GitHub Actions の schedule トリガーはベストエフォートで遅延・スキップが起こりうるため、
  # GCP Cloud Scheduler(infra/ で Terraform 管理)から repository_dispatch で毎時起動する。
  repository_dispatch:
    types: [calendar-tick]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r src/calender_fetcher/requirements.txt

      - name: Fetch calendar and notify LINE
        env:
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python src/calender_fetcher/main.py
